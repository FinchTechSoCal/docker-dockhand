#
# https://dockhand.pro/manual/
#

services:
  dockhand:
    image: fnsys/dockhand:${IMAGE_TAG:-latest}
    container_name: dockhand
    #user: "0:0" # for root
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SKIP_DF_COLLECTION=${SKIP_DF_COLLECTION}
      - DISABLE_LOCAL_LOGIN=${DISABLE_LOCAL_LOGIN} # https://dockhand.pro/manual/#disable-local-login
      - LOG_LEVEL=${LOG_LEVEL} # optional
      - DATA_DIR=${DATA_DIR}
      - HOST_DATA_DIR=${HOST_DATA_DIR}
    group_add:
      - "${DOCKER_GID}"  # Docker group GID for socket access
    volumes:
      #- ${APPDATA}/dockhand:/app/data # per documentation, map DATA_DIR instead of mapping /app/data - https://dockhand.pro/manual/#data-dir-contents
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR}:${DATA_DIR}
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: ${CONNET}
    external: true
